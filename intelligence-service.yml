server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    model.chat: openai
    openai:
      api-key: ${OPEN_AI_API_KEY}
      # base-url: https://openrouter.ai/api
      chat:
        options:
          model: gpt-5.4
          temperature: 0.2
      embedding:
        options:
          model: qwen/qwen3-embedding-8b
